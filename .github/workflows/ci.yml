name: Stage 1 CI
on:
  push:
    branches: ["stage1/implementation", "q/core-foundation", "q/core-foundation-sync", "q/stabilization", "q/executive-experience-v2", "q-os/ux-refactor-gate3-2026-11-19", "q-os/stage1-acceptance-2026-11-21"]
  pull_request:
    branches: ["main", "q/stabilization", "q/rebuild-executive-command-center"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
