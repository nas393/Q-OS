name: NASSIM OS checks
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run checks
        env:
          Q_URL: ${{ secrets.Q_URL }}
          TOKEN: ${{ secrets.Q_CHECK_TOKEN }}
          # Vercel Deployment Protection covers q-jarvis.vercel.app, so without this the call lands on the Vercel
          # login redirect ("Redirecting...") and every run fails. Value: Vercel -> q-os -> Settings ->
          # Deployment Protection -> Protection Bypass for Automation. Stored as an Actions secret, never in code.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$Q_URL" ] || [ -z "$TOKEN" ]; then echo "Secrets not set; skipping."; exit 0; fi
          if [ -z "$BYPASS" ]; then echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set; Vercel login will block this call."; fi
          base="${Q_URL%/}"   # a trailing "/" in the secret gives "//api/..." and a 308 redirect
          # Follow same-site redirects (308 keeps the POST); curl drops Authorization if a redirect changes host.
          code=$(curl -sS -L --max-redirs 3 -D headers.txt -o out.json -w "%{http_code}" -X POST "$base/api/cron/check" \
            -H "Authorization: Bearer $TOKEN" ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} --max-time 90)
          head -c 400 out.json; echo; echo "HTTP $code"
          if [ "$code" != "200" ]; then grep -i '^location:' headers.txt | sed 's/^/redirected to: /' || true; exit 1; fi
